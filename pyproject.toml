[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autosys-log-mcp"
version = "0.1.0"
description = "MCP server for searching AutoSys job logs"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0,<2",
]

[project.scripts]
autosys-log-mcp = "autosys_log_mcp.server:main"
autosys-log-web = "autosys_log_mcp.web:main"

[tool.setuptools.packages.find]
include = ["autosys_log_mcp*"]
